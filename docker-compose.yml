# docker compose up --build                  -> CPU service (without --build it pulls ghcr.io/oratoria-proyectotesis/mrcd:latest,
#                                               which exists only after a v* tag is published)
# docker compose --profile gpu up --build mrcd-gpu   -> CUDA variant (NVIDIA Container Toolkit required)
#
# Answers on http://127.0.0.1:8765 (GET /v1/health). The trained checkpoint is NOT in the image and is obtained on
# request (see models/README.md): put ckpt_audio_text.pt in ./models. Without it analysis jobs fail with
# `checkpoint_unavailable` (health still answers 200).
#
# Hardening: the service keeps jobs in memory and writes no files; /tmp (numba cache) and the home are tmpfs.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp", "/home/mrcd"]

services:
  mrcd:
    <<: *hardening
    image: ghcr.io/oratoria-proyectotesis/mrcd:latest
    build: .
    ports:
      # host loopback only; the service also requires the bearer token set below
      - "127.0.0.1:8765:8765"
    volumes:
      - ./models:/models:ro
    environment:
      # required: off loopback (inside the container) the service refuses to start without a bearer token (>= 32 chars)
      MRCD_SERVICE_TOKEN: ${MRCD_SERVICE_TOKEN:?set MRCD_SERVICE_TOKEN to a random string of at least 32 characters}
    # Allow a browser page on another origin:
    # command: ["--cors-origin", "http://localhost:5173"]
    restart: unless-stopped

  mrcd-gpu:
    <<: *hardening
    profiles: ["gpu"]
    image: ghcr.io/oratoria-proyectotesis/mrcd:latest-cuda
    build:
      context: .
      dockerfile: Dockerfile.cuda
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./models:/models:ro
    environment:
      MRCD_SERVICE_TOKEN: ${MRCD_SERVICE_TOKEN:?set MRCD_SERVICE_TOKEN to a random string of at least 32 characters}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
