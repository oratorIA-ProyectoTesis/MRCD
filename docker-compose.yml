# docker compose up               -> CPU service (pulls ghcr.io/oratoria-proyectotesis/mrcd:latest once a v* tag is
#                                    published; otherwise add --build to build it from this folder)
# docker compose --profile gpu up mrcd-gpu   -> CUDA variant (NVIDIA Container Toolkit required)
#
# Service answers on http://127.0.0.1:8765 (GET /v1/health). The trained checkpoint is NOT in the image:
# put ckpt_audio_text.pt in ./models and enable the volume below, otherwise analysis jobs fail with
# `checkpoint_unavailable` (health still answers 200).
services:
  mrcd:
    image: ghcr.io/oratoria-proyectotesis/mrcd:latest
    build: .
    ports:
      # host loopback only: the service has no authentication
      - "127.0.0.1:8765:8765"
    # volumes:
    #   - ./models:/models:ro
    # Allow a browser page on another origin:
    # command: ["--cors-origin", "http://localhost:5173"]
    restart: unless-stopped

  mrcd-gpu:
    profiles: ["gpu"]
    image: ghcr.io/oratoria-proyectotesis/mrcd:latest-cuda
    build:
      context: .
      dockerfile: Dockerfile.cuda
    ports:
      - "127.0.0.1:8765:8765"
    # volumes:
    #   - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
