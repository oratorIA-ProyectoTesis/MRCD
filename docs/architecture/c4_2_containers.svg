<rect x="50" y="90" width="320" height="90" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" stroke-dasharray=""/>
<text x="58" y="112" font-size="12.5" font-weight="700" fill="#111">Web SPA</text>
<text x="58" y="125" font-size="9.5" font-style="italic" fill="#37474f">React 19, Vite, AudioWorklet, MediaPipe worker</text>
<text x="58" y="141" font-size="10.5" fill="#222">getUserMedia mono; PCM16 16 kHz 160 ms chunks;</text>
<text x="58" y="154" font-size="10.5" fill="#222">vision and prosody summaries (~1/s); report UI. No</text>
<text x="58" y="167" font-size="10.5" fill="#222">video upload.</text>
<rect x="50" y="290" width="320" height="77" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" stroke-dasharray=""/>
<text x="58" y="312" font-size="12.5" font-weight="700" fill="#111">Local recording (research, optional)</text>
<text x="58" y="325" font-size="9.5" font-style="italic" fill="#37474f">MediaRecorder</text>
<text x="58" y="341" font-size="10.5" fill="#222">Records video+audio and only downloads it locally;</text>
<text x="58" y="354" font-size="10.5" fill="#222">keeps a local reference.</text>
<rect x="550" y="90" width="700" height="64" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" stroke-dasharray=""/>
<text x="558" y="112" font-size="12.5" font-weight="700" fill="#111">Backend API</text>
<text x="558" y="125" font-size="9.5" font-style="italic" fill="#37474f">FastAPI, WS /ws/session, REST /api/v1/sessions</text>
<text x="558" y="141" font-size="10.5" fill="#222">Authenticates, frames audio, runs the ASR port, closes segments, stores transcript and report.</text>
<rect x="550" y="290" width="230" height="103" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" stroke-dasharray=""/>
<text x="558" y="312" font-size="12.5" font-weight="700" fill="#111">ASR adapter port</text>
<text x="558" y="325" font-size="9.5" font-style="italic" fill="#37474f">SpeechRecognizer port</text>
<text x="558" y="341" font-size="10.5" fill="#222">ORATORIA_ASR_ADAPTER: simulado</text>
<text x="558" y="354" font-size="10.5" fill="#222">(default), gestionado,</text>
<text x="558" y="367" font-size="10.5" fill="#222">whisper_http, speechmatics,</text>
<text x="558" y="380" font-size="10.5" fill="#222">deepgram, oratoria_engine.</text>
<rect x="550" y="490" width="230" height="90" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" stroke-dasharray=""/>
<text x="558" y="512" font-size="12.5" font-weight="700" fill="#111">ORATORIA-ENGINE v0 (embedded)</text>
<text x="558" y="525" font-size="9.5" font-style="italic" fill="#37474f">Python, separate repo</text>
<text x="558" y="541" font-size="10.5" fill="#222">Detector v0 FP/REP/PRO,</text>
<text x="558" y="554" font-size="10.5" fill="#222">uncalibrated. This is what the app</text>
<text x="558" y="567" font-size="10.5" fill="#222">hosts today.</text>
<rect x="1000" y="290" width="250" height="77" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" stroke-dasharray=""/>
<text x="1008" y="312" font-size="12.5" font-weight="700" fill="#111">PostgreSQL</text>
<text x="1008" y="325" font-size="9.5" font-style="italic" fill="#37474f">Database</text>
<text x="1008" y="341" font-size="10.5" fill="#222">Sessions, transcript, report. No raw-</text>
<text x="1008" y="354" font-size="10.5" fill="#222">audio persistence found on the WS path.</text>
<rect x="1330" y="90" width="260" height="77" rx="6" fill="#eeeeee" stroke="#616161" stroke-width="1.8" stroke-dasharray=""/>
<text x="1338" y="112" font-size="12.5" font-weight="700" fill="#111">ASR provider</text>
<text x="1338" y="125" font-size="9.5" font-style="italic" fill="#37474f">External API</text>
<text x="1338" y="141" font-size="10.5" fill="#222">Receives audio when a cloud adapter is</text>
<text x="1338" y="154" font-size="10.5" fill="#222">configured.</text>
<rect x="750" y="770" width="300" height="103" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8" stroke-dasharray=""/>
<text x="758" y="792" font-size="12.5" font-weight="700" fill="#111">MRCD service (dev server + CLI)</text>
<text x="758" y="805" font-size="9.5" font-style="italic" fill="#37474f">mrcd/service, FastAPI loopback :8765 / CLI</text>
<text x="758" y="821" font-size="10.5" fill="#222">File in, JSON out, contract mrcd.analysis/v1.</text>
<text x="758" y="834" font-size="10.5" fill="#222">No auth, loopback only. Added in commit 955d27c</text>
<text x="758" y="847" font-size="10.5" fill="#222">after the first inspection; the app has no</text>
<text x="758" y="860" font-size="10.5" fill="#222">client for it.</text>
<rect x="750" y="920" width="300" height="90" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8" stroke-dasharray=""/>
<text x="758" y="942" font-size="12.5" font-weight="700" fill="#111">mrcd library</text>
<text x="758" y="955" font-size="9.5" font-style="italic" fill="#37474f">Python package mrcd 0.3.0</text>
<text x="758" y="971" font-size="10.5" fill="#222">DisfluencyEngine.load/analyze/analyze_file -&gt;</text>
<text x="758" y="984" font-size="10.5" fill="#222">AnalysisResult(Event, Window). Only supported</text>
<text x="758" y="997" font-size="10.5" fill="#222">entry; everything else is internal.</text>
<rect x="340" y="920" width="300" height="77" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8" stroke-dasharray=""/>
<text x="348" y="942" font-size="12.5" font-weight="700" fill="#111">Live demo</text>
<text x="348" y="955" font-size="9.5" font-style="italic" fill="#37474f">scripts/live_demo.py, FastAPI :8001</text>
<text x="348" y="971" font-size="10.5" fill="#222">Microphone -&gt; LiveScorer rows -&gt; WebSocket /ws</text>
<text x="348" y="984" font-size="10.5" fill="#222">and dashboard. Not an API for other systems.</text>
<rect x="1160" y="920" width="340" height="77" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8" stroke-dasharray=""/>
<text x="1168" y="942" font-size="12.5" font-weight="700" fill="#111">Research and batch scripts</text>
<text x="1168" y="955" font-size="9.5" font-style="italic" fill="#37474f">scripts/*.py, argparse</text>
<text x="1168" y="971" font-size="10.5" fill="#222">Dataset, training, parity, ASR recovery, audits. No</text>
<text x="1168" y="984" font-size="10.5" fill="#222">console_scripts and no CLI around analyze_file.</text>
<rect x="750" y="1070" width="300" height="77" rx="6" fill="#eeeeee" stroke="#616161" stroke-width="1.8" stroke-dasharray=""/>
<text x="758" y="1092" font-size="12.5" font-weight="700" fill="#111">Model artifacts</text>
<text x="758" y="1105" font-size="9.5" font-style="italic" fill="#37474f">Files</text>
<text x="758" y="1121" font-size="10.5" fill="#222">models/ckpt_audio_text.pt, Vc head (sha256</text>
<text x="758" y="1134" font-size="10.5" fill="#222">pinned), faster-whisper small cache.</text>
<rect x="1160" y="1070" width="340" height="77" rx="6" fill="#eeeeee" stroke="#616161" stroke-width="1.8" stroke-dasharray=""/>
<text x="1168" y="1092" font-size="12.5" font-weight="700" fill="#111">Results store</text>
<text x="1168" y="1105" font-size="9.5" font-style="italic" fill="#37474f">results/ (git-ignored)</text>
<text x="1168" y="1121" font-size="10.5" fill="#222">Reports, logs, JSON. Only force-added files are</text>
<text x="1168" y="1134" font-size="10.5" fill="#222">versioned.</text>
