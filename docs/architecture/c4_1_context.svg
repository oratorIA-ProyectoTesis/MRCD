<text x="728" y="415" font-size="9.5" font-style="italic" fill="#37474f">Files (git-ignored)</text>
<text x="728" y="431" font-size="10.5" fill="#222">DIHANA, DIME,</text>
<text x="728" y="444" font-size="10.5" fill="#222">ESLORA, own clips.</text>
<text x="728" y="457" font-size="10.5" fill="#222">Offline evaluation</text>
<text x="728" y="470" font-size="10.5" fill="#222">only; licences</text>
<text x="728" y="483" font-size="10.5" fill="#222">restrict</text>
<text x="728" y="496" font-size="10.5" fill="#222">redistribution.</text>
