<text x="388" y="122" font-size="12.5" font-weight="700" fill="#111">ORATORIA-PROYECTO web app</text>
<text x="388" y="135" font-size="9.5" font-style="italic" fill="#37474f">Software system (separate repo)</text>
<text x="388" y="151" font-size="10.5" fill="#222">Practice sessions and report. Embeds</text>
<text x="388" y="164" font-size="10.5" fill="#222">ORATORIA-ENGINE v0 (3 classes). It does</text>
<text x="388" y="177" font-size="10.5" fill="#222">NOT call MRCD.</text>
<rect x="380" y="420" width="250" height="103" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8" stroke-dasharray=""/>
<text x="388" y="442" font-size="12.5" font-weight="700" fill="#111">MRCD engine (this repo)</text>
<text x="388" y="455" font-size="9.5" font-style="italic" fill="#37474f">Software system, Python 0.3.0</text>
<text x="388" y="471" font-size="10.5" fill="#222">Experimental 7-class window classifier</text>
<text x="388" y="484" font-size="10.5" fill="#222">over audio and ASR text. Offline files</text>
<text x="388" y="497" font-size="10.5" fill="#222">and live replay. Scores are not</text>
<text x="388" y="510" font-size="10.5" fill="#222">calibrated.</text>
