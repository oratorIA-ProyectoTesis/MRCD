<text x="48" y="177" font-size="10.5" fill="#222">not see MRCD output today.</text>
<rect x="40" y="420" width="210" height="103" rx="6" fill="#fff8e1" stroke="#b28704" stroke-width="1.8" stroke-dasharray=""/>
<text x="48" y="442" font-size="12.5" font-weight="700" fill="#111">Researcher / advisor</text>
<text x="48" y="455" font-size="9.5" font-style="italic" fill="#37474f">Person</text>
<text x="48" y="471" font-size="10.5" fill="#222">Runs MRCD scripts and the live</text>
<text x="48" y="484" font-size="10.5" fill="#222">demo and reads results. OE1/OE2</text>
<text x="48" y="497" font-size="10.5" fill="#222">approval is PENDING (no</text>
<text x="48" y="510" font-size="10.5" fill="#222">signature).</text>
