<text x="728" y="595" font-size="9.5" font-style="italic" fill="#37474f">Files</text>
<text x="728" y="611" font-size="10.5" fill="#222">ckpt_audio_text.pt,</text>
<text x="728" y="624" font-size="10.5" fill="#222">Vc head, faster-</text>
<text x="728" y="637" font-size="10.5" fill="#222">whisper small cache.</text>
<rect x="940" y="100" width="220" height="103" rx="6" fill="#eeeeee" stroke="#616161" stroke-width="1.8" stroke-dasharray=""/>
<text x="948" y="122" font-size="12.5" font-weight="700" fill="#111">Cloud ASR providers</text>
<text x="948" y="135" font-size="9.5" font-style="italic" fill="#37474f">External (optional)</text>
<text x="948" y="151" font-size="10.5" fill="#222">Speechmatics, Deepgram or managed</text>
<text x="948" y="164" font-size="10.5" fill="#222">ASR, only if selected by</text>
<text x="948" y="177" font-size="10.5" fill="#222">ORATORIA_ASR_ADAPTER. Default is</text>
<text x="948" y="190" font-size="10.5" fill="#222">simulado.</text>
